<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="badgeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e4c"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#aboutBg)"/>
  
  <!-- Vital Institut Certification Seal Emblem -->
  <g transform="translate(300, 260)" text-anchor="middle">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#ff2e4c" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="120" fill="#16161a" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    
    <path d="M-30,-20 L0,-50 L30,-20 L18,40 L-18,40 Z" fill="url(#badgeRed)"/>
    <text x="0" y="70" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="2">VITAL INSTITUT BRNO</text>
    <text x="0" y="92" fill="#ff2e4c" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">OFFICIAL CERTIFIED COACH</text>
  </g>

  <!-- Bottom Accent Banner -->
  <rect x="50" y="480" width="500" height="70" rx="12" fill="#16161a" stroke="rgba(255,255,255,0.08)"/>
  <text x="300" y="512" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">7 YEARS OF PRACTICAL STRENGTH COACHING</text>
  <text x="300" y="534" text-anchor="middle" fill="#a1a1aa" font-family="sans-serif" font-size="13">Vital Institut Brno Alumni • Hybrid Athletics</text>
</svg>
